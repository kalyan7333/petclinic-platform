# customers-service — owners & pets, RDS-backed (PETPLAT-108).
# Source of truth: k8s/base/customers-service/

fullnameOverride: customers-service
image:
  name: customers-service
  tag: 72fadf1
component: service
containerPort: 8081
service:
  port: 8081
springProfiles: "docker,mysql"
env:
  CONFIG_SERVER_URL: "http://config-server:8888"
  # rds.endpoint is set per environment in helm-values/dev.yaml.
  SPRING_DATASOURCE_URL: "jdbc:mysql://{{ .Values.rds.endpoint }}:3306/petclinic?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false"
# K8s Secret `rds-credentials`, synced from Secrets Manager by External Secrets
# Operator — see k8s/base/external-secrets/rds-credentials.yaml.
secrets:
  - name: SPRING_DATASOURCE_USERNAME
    secretName: rds-credentials
    key: username
  - name: SPRING_DATASOURCE_PASSWORD
    secretName: rds-credentials
    key: password
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    imagePullPolicy: Always
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo waiting for config-server; sleep 5; done']
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
  - name: wait-for-discovery-server
    image: busybox:1.36
    imagePullPolicy: Always
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do echo waiting for discovery-server; sleep 5; done']
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
