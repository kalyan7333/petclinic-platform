# genai-service — Spring AI chat over the vet dataset (PETPLAT-108).
# Source of truth: k8s/base/genai-service/

fullnameOverride: genai-service
image:
  name: genai-service
  tag: v1.0.0
component: service
containerPort: 8084
service:
  port: 8084
springProfiles: "docker,production"
env:
  CONFIG_SERVER_URL: "http://config-server:8888"
# K8s Secret `openai-api-key`, synced from Secrets Manager by External Secrets
# Operator — see k8s/base/external-secrets/openai-api-key.yaml.
secrets:
  - name: OPENAI_API_KEY
    secretName: openai-api-key
    key: OPENAI_API_KEY
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    imagePullPolicy: Always
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo waiting for config-server; sleep 5; done']
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
  - name: wait-for-discovery-server
    image: busybox:1.36
    imagePullPolicy: Always
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do echo waiting for discovery-server; sleep 5; done']
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
