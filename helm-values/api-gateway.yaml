# api-gateway — Spring Cloud Gateway + AngularJS frontend (PETPLAT-108).
# The only user-facing service; fronted by the ALB Ingress.
# Source of truth: k8s/base/api-gateway/

fullnameOverride: api-gateway
image:
  name: api-gateway
  tag: 7d66cd0
component: gateway
containerPort: 8080
service:
  port: 8080
springProfiles: "docker"
env:
  CONFIG_SERVER_URL: "http://config-server:8888"
  DISCOVERY_SERVER_URL: "http://discovery-server:8761/eureka"
# Higher CPU than the other services — it terminates all inbound traffic.
# Matches k8s/base/api-gateway/deployment.yaml.
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    imagePullPolicy: Always
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo waiting for config-server; sleep 5; done']
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
  - name: wait-for-discovery-server
    image: busybox:1.36
    imagePullPolicy: Always
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do echo waiting for discovery-server; sleep 5; done']
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
