apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    # Admin — full control
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters, get, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, logs, get, *, allow
    p, role:admin, exec, create, */*, allow

    # Developer — view all, sync dev only.
    # The application resource is <project>/<app-name>, and dev apps are named
    # {service}-dev in the `default` project (k8s/argocd/applications/dev/), so
    # the sync pattern matches on the -dev suffix, not the target namespace.
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */*-dev, allow
    p, role:developer, logs, get, */*, allow
    p, role:developer, repositories, get, *, allow

    # Group mappings (update with actual SSO group names when SSO is configured)
    g, platform-admins, role:admin
    g, developers, role:developer
