# Dev RDS endpoint for the three DB-backed services (PETPLAT-41/45).
# Replace REPLACE_WITH_RDS_ENDPOINT with:
#   terraform -chdir=terraform/environments/dev output -raw rds_endpoint
# Name is a placeholder — the patch targets ConfigMaps by regex in kustomization.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: placeholder
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://REPLACE_WITH_RDS_ENDPOINT:3306/petclinic?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false"
