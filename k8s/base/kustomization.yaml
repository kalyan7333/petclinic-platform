apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aggregate of every petclinic workload (PETPLAT-39 through PETPLAT-44) plus the
# ALB Ingress. Consumed by the dev overlay in k8s/overlays/.
#
# Deliberately NOT included here:
#   - namespaces.yaml       — cluster-scoped; the kustomize namespace transformer
#                             rewrites Namespace names to the overlay namespace.
#                             Apply it directly instead:
#                             kubectl apply -f k8s/base/namespaces.yaml
#   - external-secrets/     — carries ENV_PLACEHOLDER namespaces substituted by
#                             scripts/install-external-secrets.sh, and the CRDs
#                             are not installed until the operator is running.
resources:
  - config-server
  - discovery-server
  - api-gateway
  - customers-service
  - visits-service
  - vets-service
  - genai-service
  - admin-server
  - ingress
