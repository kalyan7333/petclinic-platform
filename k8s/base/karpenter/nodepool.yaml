apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: petclinic-default
spec:
  template:
    metadata:
      labels:
        managed-by: karpenter
        project: petclinic
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: petclinic-default

      requirements:
        # ARM/Graviton preferred — matches existing node group
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        # Allow spot first, fall back to on-demand
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        # Graviton instance families with multiple options for spot availability
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t4g.small
            - t4g.medium
            - t4g.large

      # Consolidation: remove under-utilized nodes
      disruption:
        consolidationPolicy: WhenUnderutilized
        expireAfter: 720h   # Recycle nodes every 30 days

  limits:
    cpu: "16"
    memory: 32Gi
