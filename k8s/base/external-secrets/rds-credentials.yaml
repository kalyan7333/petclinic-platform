# Syncs petclinic/{env}/rds-credentials (JSON) from Secrets Manager into the
# K8s Secret `rds-credentials` (PETPLAT-35).
# ENV_PLACEHOLDER is substituted with dev by scripts/install-external-secrets.sh.
# Consumed by customers-service, visits-service and vets-service through
# envFromSecret in helm-values/{service}.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: petclinic-ENV_PLACEHOLDER
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
    # Keep the K8s Secret if the ExternalSecret is deleted, so running pods do
    # not lose their datasource credentials mid-flight.
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/ENV_PLACEHOLDER/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/ENV_PLACEHOLDER/rds-credentials
        property: password
