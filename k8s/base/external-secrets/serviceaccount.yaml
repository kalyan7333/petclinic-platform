# ServiceAccount assumed by the ESO controller through IRSA (PETPLAT-34/37).
# ROLE_ARN_PLACEHOLDER is substituted by scripts/install-external-secrets.sh with
# the Terraform output `eso_role_arn` (petclinic-{env}-eso-role).
# The ESO Helm release is installed with serviceAccount.create=false so this
# manifest stays the single source of truth for the IRSA annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
  annotations:
    eks.amazonaws.com/role-arn: ROLE_ARN_PLACEHOLDER
