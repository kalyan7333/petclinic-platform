# ClusterSecretStore backing every ExternalSecret in the cluster (PETPLAT-34).
# Cluster-scoped so petclinic-dev ExternalSecrets can
# reference it. Auth is IRSA via the external-secrets-sa ServiceAccount, whose
# IAM role only allows reading petclinic/{env}/* secrets.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
