---
# Dev namespace resource quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: petclinic-dev-quota
  namespace: petclinic-dev
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
    services: "20"
    persistentvolumeclaims: "10"

---
# LimitRange for dev — apply defaults to pods without explicit requests
apiVersion: v1
kind: LimitRange
metadata:
  name: petclinic-dev-limits
  namespace: petclinic-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 1Gi
